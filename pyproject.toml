[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-spectrum-minimax-h3"
version = "0.1.0"
description = "Spectrum-style spectral feature forecasting for native ComfyUI MiniMax H3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "xmarre" }]
keywords = ["comfyui", "minimax-h3", "spectrum", "diffusion", "video", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3"
Issues = "https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3/issues"

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "Spectrum MiniMax H3"
Icon = ""

[tool.setuptools.packages.find]
include = ["comfyui_spectrum_h3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
