name: sync-v0.2.11-release-notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-v0.2.11-release-notes.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync published v0.2.11 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          grep -qx '# Spectrum MiniMax H3 v0.2.11' RELEASE_NOTES.md
          gh release edit v0.2.11 --notes-file RELEASE_NOTES.md
